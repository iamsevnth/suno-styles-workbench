# Weekly update pull requests for npm packages and GitHub Actions. Each runs the full test and
# build workflow before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The site builds and tests on Node.js 22 (deploy.yml), so its type definitions stay on 22.
      # Minor and patch updates within 22 still arrive. Raise this together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
