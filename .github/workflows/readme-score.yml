name: README Score

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "README.*"
      - ".github/workflows/readme-score.yml"
  pull_request:
    paths:
      - "README.md"
      - "README.*"

permissions:
  contents: read

jobs:
  score:
    name: Score README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run README Score
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f README.md ]]; then
            echo "::warning file=README.md::README.md is missing; README Score skipped."
            {
              echo "## README Score"
              echo
              echo "README.md is missing, so scoring was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          output="$(npx --yes readme-score@1.0.0)"
          printf '%s\n' "$output"

          {
            echo "## README Score"
            echo
            echo '~~~text'
            printf '%s\n' "$output"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
