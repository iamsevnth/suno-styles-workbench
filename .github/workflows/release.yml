name: Official release (standalone HTML)

# Publish only after the trusted main-branch production pipeline completes.
# This workflow never consumes PR artifacts or executes code from fork branches.
# The version comes from package.json. A release is created the first time a version reaches
# main; existing tags and assets are never overwritten, so earlier releases stay immutable.
on:
  workflow_run:
    workflows: ["Test and deploy"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated main-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check release version, notes and documentation
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected version $VERSION"; exit 1; }
          VERSION="$VERSION" node --input-type=module -e 'import fs from "node:fs"; const v=process.env.VERSION; const l=JSON.parse(fs.readFileSync("package-lock.json","utf8")); if(l.version!==v || l.packages[""].version!==v) { throw new Error("package-lock.json does not match package.json " + v); }'
          grep -Fq "The current package version is **$VERSION**" README.md
          test -s "docs/releases/v$VERSION.md"
          grep -Fq "suno-workbench-sevnthlabs-v$VERSION.html" "docs/releases/v$VERSION.md"
          test -s src/content/guide/verified/fidelity-inspector.md
          test -s src/content/guide/verified/lyrics-arranger.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build hosted app, standalone HTML, and validate CSP
        run: npm run build

      - name: Package and verify standalone release HTML
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          readonly ASSET="suno-workbench-sevnthlabs-v${VERSION}.html"
          test -s dist/suno-workbench.html
          test "$(wc -c < dist/suno-workbench.html)" -gt 100000
          cp dist/suno-workbench.html "dist/$ASSET"
          cmp -s dist/suno-workbench.html "dist/$ASSET"
          (
            cd dist
            sha256sum "$ASSET" > "$ASSET.sha256"
            sha256sum --check "$ASSET.sha256"
          )
          test -s "dist/$ASSET.sha256"

      - name: Publish immutable versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          readonly TAG="v${VERSION}"
          readonly ASSET="suno-workbench-sevnthlabs-v${VERSION}.html"
          readonly RELEASE_TITLE="suno-workbench-sevnthlabs-v${VERSION}"
          readonly COMMIT_SHA="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "::error::A draft release $TAG exists. Publish or delete it, then re-run this workflow."
              exit 1
            fi
            echo "Release already exists; checking asset names without overwriting."
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET.sha256"
          else
            gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" \
              --title "$RELEASE_TITLE" \
              --notes-file "docs/releases/v${VERSION}.md" \
              --target "$COMMIT_SHA" \
              --latest
          fi
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, title: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET.sha256"
