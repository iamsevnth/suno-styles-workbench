name: Security Findings Triage (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/security-findings-triage.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  vulnerability-alerts: read
  code-quality: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Repository Alert Metadata (Read-Only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          probe() {
            local name="$1" endpoint="$2" format="$3" output
            echo "### $name"
            if output="$(gh api -H 'Accept: application/vnd.github+json' "$endpoint" 2>/tmp/triage-error)"; then
              if echo "$output" | jq -e 'type == "array"' >/dev/null 2>&1; then
                echo "$output" | jq -c "$format"
                echo "ENTRY_COUNT: $(echo "$output" | jq 'length')"
              else
                echo "Unexpected response type. No details printed."
              fi
            else
              echo "UNAVAILABLE: $(head -c 250 /tmp/triage-error | tr '\n' ' ')"
            fi
            echo
          }
          probe "CODE_SCANNING_OPEN" "/repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100"             '.[] | {number, rule_id: .rule.id, title: .rule.description, severity: (.rule.security_severity_level // .rule.severity), path: .most_recent_instance.location.path, line: .most_recent_instance.location.start_line, tool: .tool.name}'
          probe "DEPENDABOT_OPEN" "/repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100"             '.[] | {number, package: .dependency.package.name, ecosystem: .dependency.package.ecosystem, severity: .security_vulnerability.severity, summary: .security_advisory.summary, fixed_version: .security_vulnerability.first_patched_version.identifier}'
          probe "CODE_QUALITY_OPEN" "/repos/$GITHUB_REPOSITORY/code-quality/findings?state=open&per_page=100"             '.[] | {number, rule_id: (.rule.id // .rule_id), title: (.title // .message), severity: (.severity // .priority), path: (.location.path // .file_path)}'
          probe "SECRET_SCANNING_OPEN_COUNT_ONLY" "/repos/$GITHUB_REPOSITORY/secret-scanning/alerts?state=open&per_page=100"             'length | {open_alerts: .}'
