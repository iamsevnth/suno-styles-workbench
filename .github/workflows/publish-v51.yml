name: Publish Suno Workbench v5.1

on:
  workflow_run:
    workflows: ["Test and deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-suno-workbench-v51
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'iamsevnth/suno-styles-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify v5.1 Version And Release Notes
        run: |
          set -euo pipefail
          jq -e '.version == "5.1.0"' package.json >/dev/null
          jq -e '.version == "5.1.0" and .packages[""].version == "5.1.0"' package-lock.json >/dev/null
          test -s docs/releases/v5.1.md

      - name: Publish v5.1 Tag And Official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "Validated commit is no longer at main. Refusing stale release publication."
            exit 1
          fi
          if gh release view v5.1 >/dev/null 2>&1; then
            echo "v5.1 already published. Refusing to overwrite."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v5.1" >/dev/null 2>&1; then
            echo "An unexpected v5.1 tag already exists without a matching published release."
            exit 1
          fi
          gh release create v5.1 \
            --target "$VALIDATED_SHA" \
            --title "Suno Workbench v5.1 — Precision, Sonic Identity & Creative Control" \
            --notes-file docs/releases/v5.1.md \
            --latest
